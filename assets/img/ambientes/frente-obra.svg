<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <defs>
    <linearGradient id="cielo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7fb4e0"/><stop offset="1" stop-color="#d6e8f4"/>
    </linearGradient>
    <linearGradient id="revoque" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c2beb6"/><stop offset="1" stop-color="#a39f97"/>
    </linearGradient>
    <pattern id="bloque" width="96" height="48" patternUnits="userSpaceOnUse">
      <rect width="96" height="48" fill="#8f8a82"/>
      <rect x="2" y="2" width="92" height="20" fill="#c9785a"/>
      <rect x="-46" y="26" width="92" height="20" fill="#bf6f52"/>
      <rect x="50" y="26" width="92" height="20" fill="#d08262"/>
    </pattern>
    <linearGradient id="hueco" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2c2a28"/><stop offset="1" stop-color="#121110"/>
    </linearGradient>
    <linearGradient id="tierra" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a48a68"/><stop offset="1" stop-color="#84694a"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#cielo)"/>
  <ellipse cx="220" cy="70" rx="110" ry="22" fill="#fff" opacity="0.8"/>
  <ellipse cx="930" cy="50" rx="140" ry="20" fill="#fff" opacity="0.7"/>

  <!-- Hierros de espera -->
  <g stroke="#6f4a34" stroke-width="5">
    <path d="M180 110V50M400 110V40M640 110V52M880 110V44M1060 110V56"/>
  </g>

  <!-- Fachada: revoque grueso a la izquierda, ladrillo hueco a la derecha -->
  <rect x="90" y="130" width="1020" height="530" fill="url(#bloque)"/>
  <path d="M90 130h700l-40 70 30 90-50 110 40 120-30 140H90z" fill="url(#revoque)"/>
  <g fill="#000" opacity="0.05">
    <circle cx="200" cy="220" r="40"/><circle cx="560" cy="580" r="50"/><circle cx="300" cy="560" r="34"/><circle cx="640" cy="190" r="30"/>
  </g>

  <!-- Encadenado -->
  <rect x="70" y="106" width="1060" height="30" fill="#9b9790"/>
  <rect x="70" y="134" width="1060" height="6" fill="#000" opacity="0.22"/>

  <!-- Vano de la ventana -->
  <rect x="366" y="246" width="372" height="270" fill="url(#hueco)"/>
  <path d="M366 516l60-40h252l60 40z" fill="#3a3632"/>
  <rect x="356" y="226" width="392" height="22" fill="#8b877f"/>
  <rect x="366" y="246" width="372" height="12" fill="#000" opacity="0.35"/>
  <rect x="356" y="516" width="392" height="12" fill="#b3aea6"/>
  <rect x="356" y="526" width="392" height="4" fill="#000" opacity="0.25"/>

  <!-- Vano de puerta -->
  <rect x="860" y="330" width="150" height="330" fill="url(#hueco)"/>
  <rect x="850" y="312" width="170" height="20" fill="#8b877f"/>

  <!-- Andamio -->
  <g stroke="#3d4b5a" stroke-width="7" fill="none">
    <path d="M150 660V170M300 660V170M150 300h150M150 450h150M150 300l150 150M300 300L150 450"/>
  </g>
  <rect x="136" y="290" width="178" height="12" fill="#b88a55"/>
  <rect x="136" y="440" width="178" height="12" fill="#b88a55"/>

  <!-- Terreno -->
  <rect y="660" width="1200" height="140" fill="url(#tierra)"/>
  <path d="M0 660h1200v10H0z" fill="#000" opacity="0.18"/>
  <path d="M560 760c30-70 90-90 140-60 40-30 100-10 120 60z" fill="#b9a27e"/>
  <path d="M600 740c20-30 50-40 80-26" stroke="#8f7a5c" stroke-width="4" fill="none"/>
  <g fill="#c9785a" stroke="#8f4f3a" stroke-width="2">
    <rect x="930" y="700" width="70" height="28"/><rect x="1004" y="700" width="70" height="28"/><rect x="966" y="672" width="70" height="28"/>
  </g>
  <rect x="380" y="700" width="60" height="50" rx="4" fill="#d9d4cb"/>
  <rect x="380" y="712" width="60" height="10" fill="#4a7bb0"/>
  <g fill="#7b6a4f" opacity="0.6">
    <circle cx="120" cy="730" r="6"/><circle cx="260" cy="770" r="5"/><circle cx="820" cy="720" r="5"/><circle cx="1120" cy="760" r="7"/>
  </g>
</svg>
